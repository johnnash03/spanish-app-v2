# Transfer patterns — English → Spanish suffix/stem transformations.
# Not in the rule DAG. Never drilled as primary structure. Each pattern
# passively expands the vocab universe for subsequent grammar lessons.
#
# Batch 1 coverage: ReferenceNotes §§2–20. Lesson numbers refer to the
# lesson plan in generation-notes/batch-01-lesson-plan.yaml.

transfer_patterns:
  - id: suffix-al-stays
    english_cue: "word ends in -al"
    spanish_form: "same -al form; stress falls on the final -al"
    introduced_in_lesson: 1
    examples: [normal, legal, natural, metal, ilegal, liberal]

  - id: suffix-ant-ent-to-e
    english_cue: "word ends in -ant or -ent"
    spanish_form: "append -e"
    introduced_in_lesson: 2
    examples:
      - "important → importante"
      - "different → diferente"
      - "constant → constante"

  - id: suffix-ible-able-stays
    english_cue: "word ends in -ible or -able"
    spanish_form: "same -ible / -able form"
    introduced_in_lesson: 2
    examples:
      - "possible → posible"
      - "durable → durable"

  - id: suffix-mente-equals-ly
    english_cue: "English adverb ending in -ly"
    spanish_form: "replace -ly with -mente (typically stacks on the adjective)"
    introduced_in_lesson: 2
    examples:
      - "really → realmente"
      - "constantly → constantemente"
      - "illegally → ilegalmente"

  - id: suffix-tion-to-cion
    english_cue: "noun ending in -tion"
    spanish_form: "replace -tion with -cion (feminine). To derive the verb, drop -cion and add -ar."
    introduced_in_lesson: 3
    examples:
      - "nation → nacion"
      - "preparation → preparacion → preparar"
      - "confirmation → confirmacion → confirmar"
      - "organisation → organisacion → organisar"
      - "exploration → exploracion → explorar"
      - "cancellation → cancelacion → cancelar"

  - id: suffix-ence-ance-to-encia-ancia
    english_cue: "word ends in -ence or -ance"
    spanish_form: "replace -ence with -encia, -ance with -ancia (feminine)"
    introduced_in_lesson: 6
    examples:
      - "difference → diferencia"
      - "influence → influencia"
      - "existence → existencia"
      - "importance → importancia"

  - id: suffix-ity-to-idad
    english_cue: "noun ending in -ity"
    spanish_form: "replace -ity with -idad (feminine)"
    introduced_in_lesson: 13
    examples:
      - "university → universidad"
      - "possibility → posibilidad"
      - "diversity → diversidad"
      - "creativity → creatividad"
      - "nationality → nacionalidad"

  - id: suffix-ary-to-ario
    english_cue: "adjective ending in -ary"
    spanish_form: "replace -ary with -ario"
    introduced_in_lesson: 14
    examples:
      - "necessary → necesario"
      - "contrary → contrario"

  - id: stem-pose-to-poner
    english_cue: "English verb contains '-pose'"
    spanish_form: "replace -pose with -poner (verb takes on poner conjugation)"
    introduced_in_lesson: 16
    examples:
      - "compose → componer"
      - "suppose → suponer"
      - "impose → imponer"
      - "expose → exponer"
      - "oppose → oponer"
