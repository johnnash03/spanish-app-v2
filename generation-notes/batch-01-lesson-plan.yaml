# Batch 01 — Proposed Lesson Plan
#
# Covers ReferenceNotes §§2–20 (the file has no §1; teacher numbering starts at §2).
# 22 lessons from 19 teacher sections. See batch-01-improvements.md for packaging decisions.
#
# Anchor `source:` values: teacher | ai-edited | ai-generated.

lessons:
  # ──────────────────────────────────────────────────────────────
  - id: 1
    title: "-al words are free Spanish"
    source_refs: ["ReferenceNotes.md#2"]
    prerequisite_lessons: []
    rules_introduced: [negation-no-before-verb]
    rules_reinforced: []
    transfer_patterns_introduced: [suffix-al-stays]
    vocab_introduced: [ser, no]
    anchor_sentences:
      - en: "It is illegal"
        es: "Es ilegal"
        drills: [suffix-al-stays]
        source: teacher
      - en: "He is liberal"
        es: "Es liberal"
        drills: [suffix-al-stays]
        source: teacher
      - en: "It's not normal"
        es: "No es normal"
        drills: [suffix-al-stays, negation-no-before-verb]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 2
    title: "More cognate power-ups: -ant/-ent/-ible/-able/-mente"
    source_refs: ["ReferenceNotes.md#3"]
    prerequisite_lessons: [1]
    rules_introduced: [phonology-ja-to-kh]
    rules_reinforced: []
    transfer_patterns_introduced:
      - suffix-ant-ent-to-e
      - suffix-ible-able-stays
      - suffix-mente-equals-ly
    vocab_introduced: []
    anchor_sentences:
      - en: "important"
        es: "importante"
        drills: [suffix-ant-ent-to-e]
        source: teacher
      - en: "different"
        es: "diferente"
        drills: [suffix-ant-ent-to-e]
        source: teacher
      - en: "possible"
        es: "posible"
        drills: [suffix-ible-able-stays]
        source: teacher
      - en: "really"
        es: "realmente"
        drills: [suffix-mente-equals-ly]
        source: teacher
      - en: "constantly"
        es: "constantemente"
        drills: [suffix-mente-equals-ly, suffix-ant-ent-to-e]
        source: teacher

