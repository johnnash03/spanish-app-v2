  # ──────────────────────────────────────────────────────────────
  - id: 7
    title: "Intentar (to try); silent h"
    source_refs: ["ReferenceNotes.md#6"]
    prerequisite_lessons: [6]
    rules_introduced:
      - intentar-plus-infinitive-no-a
      - phonology-h-silent
    rules_reinforced:
      - do-pronoun-postverbal-infinitive
      - modal-quiero-plus-infinitive
    transfer_patterns_introduced: []
    vocab_introduced: [intentar, continuar, conveniente, visitar, publicar, imitar, administrar]
    anchor_sentences:
      - en: "I am trying to publish it"
        es: "Intento publicar lo"
        drills: [intentar-plus-infinitive-no-a, do-pronoun-postverbal-infinitive]
        source: teacher
      - en: "I am trying to continue it"
        es: "Intento continuar lo"
        drills: [intentar-plus-infinitive-no-a, do-pronoun-postverbal-infinitive]
        source: teacher
      - en: "I want to visit him"
        es: "Quiero visitar lo"
        drills: [modal-quiero-plus-infinitive, do-pronoun-postverbal-infinitive]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 8
    title: "Verbs of motion take 'a': voy, pasar; 'los' for them"
    source_refs: ["ReferenceNotes.md#7"]
    prerequisite_lessons: [7]
    rules_introduced:
      - verb-motion-plus-a-before-infinitive
      - do-pronoun-plural-los-las
    rules_reinforced:
      - intentar-plus-infinitive-no-a
      - do-pronoun-postverbal-infinitive
    transfer_patterns_introduced: []
    vocab_introduced: [ir, pasar, ver, mostrar, demostrar, algo]
    anchor_sentences:
      - en: "I want to see them"
        es: "Quiero ver los"
        drills: [do-pronoun-plural-los-las, modal-quiero-plus-infinitive]
        source: teacher
      - en: "I am going to see them"
        es: "Voy a ver los"
        drills: [verb-motion-plus-a-before-infinitive, do-pronoun-plural-los-las]
        source: teacher
      - en: "I am going to try to see them"
        es: "Voy a intentar ver los"
        drills: [verb-motion-plus-a-before-infinitive, intentar-plus-infinitive-no-a, do-pronoun-plural-los-las]
        source: teacher
      - en: "I am going to pass by to visit you"
        es: "Voy a pasar a visitar te"
        drills: [verb-motion-plus-a-before-infinitive, do-pronoun-postverbal-infinitive]
        source: teacher
      - en: "I want to show you something"
        es: "Quiero mostrar te algo"
        drills: [modal-quiero-plus-infinitive, reflexive-pronoun-attach-infinitive]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 9
    title: "Quiere, venir, debo; 'a la casa'"
    source_refs: ["ReferenceNotes.md#8"]
    prerequisite_lessons: [8]
    rules_introduced:
      - verb-quiere-third-person-singular
      - modal-debo-plus-infinitive-no-que
      - preposition-a-motion-destination
      - article-el-la-basic
    rules_reinforced:
      - do-pronoun-postverbal-infinitive
      - verb-motion-plus-a-before-infinitive
      - reflexive-pronoun-attach-infinitive
    transfer_patterns_introduced: []
    vocab_introduced: [venir, casa, deber, identificar]
    anchor_sentences:
      - en: "You (formal) want to visit me"
        es: "Quiere visitar me"
        drills: [verb-quiere-third-person-singular, reflexive-pronoun-attach-infinitive]
        source: teacher
      - en: "Why don't you want to visit me"
        es: "Por que no quiere visitar me"
        drills: [verb-quiere-third-person-singular, negation-no-before-verb]
        source: teacher
      - en: "Do you want to come to the house?"
        es: "Quiere venir a la casa"
        drills: [verb-quiere-third-person-singular, verb-motion-plus-a-before-infinitive, preposition-a-motion-destination, article-el-la-basic]
        source: teacher
      - en: "I must continue"
        es: "Debo continuar"
        drills: [modal-debo-plus-infinitive-no-que]
        source: teacher
      - en: "I must identify it"
        es: "Debo identificar lo"
        drills: [modal-debo-plus-infinitive-no-que, do-pronoun-postverbal-infinitive]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 10
    title: "Saber (to know); si (yes / if)"
    source_refs: ["ReferenceNotes.md#9"]
    prerequisite_lessons: [9]
    rules_introduced: [conjunction-si-yes-or-if]
    rules_reinforced:
      - modal-quiero-plus-infinitive
      - verb-quiere-third-person-singular
      - do-pronoun-postverbal-infinitive
      - reflexive-pronoun-attach-infinitive
    transfer_patterns_introduced: []
    vocab_introduced: [saber, invitar, imaginar, iniciar, ahora, explicar, justificar]
    anchor_sentences:
      - en: "I want to know why he doesn't want to know"
        es: "Quiero saber por que no quiere saber"
        drills: [modal-quiero-plus-infinitive, verb-quiere-third-person-singular]
        source: teacher
      - en: "I want to know if you want to know"
        es: "Quiero saber si quiere saber"
        drills: [conjunction-si-yes-or-if, modal-quiero-plus-infinitive, verb-quiere-third-person-singular]
        source: teacher
      - en: "I want to know if she wants to come to the house to visit me"
        es: "Quiero saber si quiere venir a la casa a visitar me"
        drills: [conjunction-si-yes-or-if, verb-motion-plus-a-before-infinitive, preposition-a-motion-destination, article-el-la-basic, reflexive-pronoun-attach-infinitive]
        source: teacher
      - en: "I don't want to imagine it"
        es: "No quiero imaginar lo"
        drills: [modal-quiero-plus-infinitive, do-pronoun-postverbal-infinitive, negation-no-before-verb]
        source: teacher

