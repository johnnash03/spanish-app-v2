      - negation-no-before-verb
      - verb-present-third-plural-add-n
    transfer_patterns_introduced: [suffix-ity-to-idad]
    vocab_introduced: [vender, contaminar, celebracion, administracion, asociacion, nos]
    anchor_sentences:
      - en: "I am selling them"
        es: "Los vendo"
        drills: [verb-present-yo-regular, do-pronoun-plural-los-las, pronoun-placement-flexible]
        source: teacher
      - en: "I am selling the houses"
        es: "Vendo las casas"
        drills: [verb-present-yo-regular, article-el-la-basic]
        source: teacher
      - en: "They are not selling it to me"
        es: "No me lo venden"
        drills: [pronoun-compound-indirect-before-direct, verb-present-third-plural-add-n, negation-no-before-verb]
        source: teacher
      - en: "Why don't they sell it to me"
        es: "Por que no me lo venden"
        drills: [pronoun-compound-indirect-before-direct, verb-present-third-plural-add-n]
        source: teacher
      - en: "They are not selling it to us"
        es: "No nos lo venden"
