        es: "preparar"
        drills: [suffix-tion-to-cion]
        source: teacher
      - en: "confirmation"
        es: "confirmacion"
        drills: [suffix-tion-to-cion]
        source: teacher
      - en: "to cancel"
        es: "cancelar"
        drills: [suffix-tion-to-cion]
        source: teacher
      - en: "organisation"
        es: "organisacion"
        drills: [suffix-tion-to-cion]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 4
    title: "'I want to ___': quiero + to-verb, and reflexive 'me'"
    source_refs: ["ReferenceNotes.md#4"]
    prerequisite_lessons: [3]
    rules_introduced:
      - modal-quiero-plus-infinitive
      - reflexive-pronoun-attach-infinitive
    rules_reinforced: [negation-no-before-verb]
    transfer_patterns_introduced: []
    vocab_introduced: [querer, preparar, cancelar, me]
    anchor_sentences:
      - en: "I don't want to cancel"
        es: "No quiero cancelar"
        drills: [modal-quiero-plus-infinitive, negation-no-before-verb]
        source: teacher
      - en: "I want to get ready"
        es: "Quiero preparar me"
        drills: [modal-quiero-plus-infinitive, reflexive-pronoun-attach-infinitive]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 5
    title: "Object pronouns stick to 'to-verbs'; 'yo' for emphasis"
    source_refs: ["ReferenceNotes.md#5"]
    prerequisite_lessons: [4]
    rules_introduced:
      - pronoun-yo-emphasis
      - do-pronoun-basic
      - do-pronoun-postverbal-infinitive
      - phonology-rr-rolled
    rules_reinforced:
      - modal-quiero-plus-infinitive
      - reflexive-pronoun-attach-infinitive
      - negation-no-before-verb
    transfer_patterns_introduced: []
    vocab_introduced:
      - yo
      - lo
      - la
      - te
      - salvar
      - situar
      - participar
      - crear
      - experimentar
      - obligar
      - provocar
      - informar
    anchor_sentences:
      - en: "I (emphatic) don't want to cancel"
        es: "Yo no quiero cancelar"
        drills: [pronoun-yo-emphasis, negation-no-before-verb]
        source: teacher
      - en: "I want to cancel it"
        es: "Quiero cancelar lo"
        drills: [do-pronoun-postverbal-infinitive, do-pronoun-basic]
        source: teacher
      - en: "I don't want to force you"
        es: "No quiero obligar te"
        drills: [do-pronoun-postverbal-infinitive, negation-no-before-verb]
        source: teacher
      - en: "I want to inform myself"
        es: "Quiero informar me"
        drills: [reflexive-pronoun-attach-infinitive]
        source: teacher

