        drills: [verb-present-third-plural-add-n, pronoun-compound-indirect-before-direct]
        source: teacher
      - en: "necessary"
        es: "necesario"
        drills: [suffix-ary-to-ario]
        source: teacher
      - en: "contrary"
        es: "contrario"
        drills: [suffix-ary-to-ario]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 15
