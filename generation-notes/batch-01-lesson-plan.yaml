        source: teacher
      - en: "university"
        es: "universidad"
        drills: [suffix-ity-to-idad]
        source: teacher
      - en: "possibility"
        es: "posibilidad"
        drills: [suffix-ity-to-idad]
        source: teacher

  # ──────────────────────────────────────────────────────────────
  - id: 14
    title: "Hacer, puedo, llegar/salir/esperar; 'que' for what; -ary → -ario"
    source_refs: ["ReferenceNotes.md#13"]
    prerequisite_lessons: [13]
    rules_introduced:
      - modal-puedo-plus-infinitive
      - verb-present-tu-informal
      - interrogative-que-what
    rules_reinforced:
      - verb-present-yo-regular
      - verb-present-third-singular-ar
      - verb-present-third-singular-er
      - verb-present-third-plural-add-n
    transfer_patterns_introduced: [suffix-ary-to-ario]
    vocab_introduced: [hacer, poder, llegar, salir, esperar, que]
    anchor_sentences:
      - en: "He is doing it"
        es: "Lo hace"
        drills: [verb-present-third-singular-er, pronoun-placement-flexible]
        source: teacher
      - en: "What are you doing / How are you"
        es: "Que haces"
        drills: [interrogative-que-what, verb-present-tu-informal]
        source: teacher
      - en: "Can you come"
        es: "Puedes venir"
        drills: [modal-puedo-plus-infinitive, verb-present-tu-informal]
