  # ──────────────────────────────────────────────────────────────
  - id: 17
    title: "Stem change e → ie (pienso, entiende); cuando"
    source_refs: ["ReferenceNotes.md#15"]
    prerequisite_lessons: [16]
    rules_introduced:
      - verb-stem-change-e-to-ie
      - interrogative-cuando-when
    rules_reinforced:
      - verb-present-yo-regular
      - verb-present-third-singular-ar
      - verb-present-third-singular-er
      - verb-present-third-plural-add-n
    transfer_patterns_introduced: []
    vocab_introduced: [pasar, pensar, entender, perder, cerrar, tiempo, concierto, noviembre, cuando]
    # `pasar` is vocabularily reintroduced here in its "to happen" sense, though
    # the lemma was first seen in L8 as a motion verb. Keeping it here for anchors.
    anchor_sentences:
      - en: "What's going on?"
        es: "Que pasa"
        drills: [interrogative-que-what, verb-present-third-singular-ar]
        source: teacher
      - en: "I want to know what's going on"
        es: "Quiero saber que pasa"
        drills: [interrogative-que-what]
        source: teacher
      - en: "What do you think?"
        es: "Que piensas"
        drills: [verb-stem-change-e-to-ie, verb-present-tu-informal, interrogative-que-what]
        source: teacher
      - en: "I plan to eat later"
        es: "Pienso comer mas tarde"
        drills: [verb-stem-change-e-to-ie, future-via-time-marker]
        source: teacher
      - en: "I understand"
        es: "Entiendo"
        drills: [verb-stem-change-e-to-ie]
        source: teacher
      - en: "When are you coming?"
        es: "Cuando vienes"
