  # ──────────────────────────────────────────────────────────────
  - id: 13
    title: "First -er verb (vender); -ion is feminine; 'me lo' double pronouns; nos; -ity → -idad"
    source_refs: ["ReferenceNotes.md#12"]
    prerequisite_lessons: [12]
    rules_introduced:
      - verb-present-third-singular-er
      - noun-gender-ion-feminine
      - pronoun-compound-indirect-before-direct
      - pronoun-nos-us
    rules_reinforced:
