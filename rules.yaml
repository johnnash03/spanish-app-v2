# Versioned rule catalog. Append-mostly; renames logged in generation-notes/.
# Categories: grammar | phonology | exception-cluster
# Transfer patterns (suffix/stem transformations) live in transfer-patterns.yaml, NOT here.
#
# Conventions:
# - `vocab_refs` is used on closed-set rules (exception-clusters and stem-change
#   classes) to enumerate affected verbs. Regular-pattern rules omit it.

rules:
  # ──────────────────────────────────────────────────────────────
  # Lesson 1 — §2 (-al cognates + implicit negation)
  # ──────────────────────────────────────────────────────────────

  - id: negation-no-before-verb
    category: grammar
    description: "Negation: place `no` directly before the conjugated verb. No auxiliary."
    prerequisites: []
    introduced_in_lesson: 1
    examples:
      - "No es normal"
      - "No quiero cancelar"
    exceptions: []
    # GAP-FILL: teacher uses negation from §2 but never states the rule. See batch-01-gaps.md.

  # ──────────────────────────────────────────────────────────────
  # Lesson 2 — §3 (phonology notes alongside transfer patterns)
  # ──────────────────────────────────────────────────────────────

  - id: phonology-ja-to-kh
    category: phonology
    description: "The letter `j` is pronounced as a guttural /x/ ('kh') in all positions (ja/je/ji/jo/ju). The letter `g` before `e` or `i` (ge, gi) shares the same sound. Not typically drilled."
    prerequisites: []
    introduced_in_lesson: 2
    examples: []
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 4 — §4 tail (first grammar lesson: quiero + infinitive + reflexive me)
  # ──────────────────────────────────────────────────────────────

  - id: modal-quiero-plus-infinitive
    category: grammar
    description: "`quiero` (I want) takes an infinitive directly: quiero + [to-verb]. No 'que', no preposition."
    prerequisites: []
    introduced_in_lesson: 4
    examples:
      - "Quiero cancelar"
      - "Quiero preparar"
    exceptions: []
    # At this lesson, `quiero` is a memorized chunk — its underlying stem change
    # (querer → quiero, e→ie) is not introduced until L17.

  - id: reflexive-pronoun-attach-infinitive
    category: grammar
    description: "A reflexive pronoun (me, te, se) attaches to the end of an infinitive: prepararme, informarme."
    prerequisites: [modal-quiero-plus-infinitive]
    introduced_in_lesson: 4
    examples:
      - "Quiero prepararme"
      - "Quiero informarme"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 5 — §5 (yo emphasis, direct-object pronouns postverbal, rolling rr)
  # ──────────────────────────────────────────────────────────────

  - id: pronoun-yo-emphasis
    category: grammar
    description: "`Yo` (I) is optional and used for emphasis: `Yo no quiero cancelar`. Subject pronouns in general are optional when context is clear."
    prerequisites: []
    introduced_in_lesson: 5
    examples:
      - "Yo no quiero cancelar"
      - "Yo no quiero invitarlo pero ella si"
    exceptions: []

  - id: do-pronoun-basic
    category: grammar
    description: "Direct object pronouns: lo (it / him / you-formal masc), la (it / her / you-formal fem), me (me), te (you-informal)."
    prerequisites: []
    introduced_in_lesson: 5
    examples:
      - "lo = it / him"
      - "me = me"
    exceptions: []

  - id: do-pronoun-postverbal-infinitive
    category: grammar
    description: "A direct object pronoun attaches to the end of an infinitive: `quiero cancelarlo`, `quiero visitarlo`."
    prerequisites: [do-pronoun-basic, modal-quiero-plus-infinitive]
    introduced_in_lesson: 5
    examples:
      - "Quiero cancelarlo"
      - "Quiero visitarlo"
      - "No quiero obligarte"
    exceptions: []

  - id: phonology-rr-rolled
    category: phonology
    description: "Double-r `rr` inside a word is trilled/rolled: perro."
    prerequisites: []
    introduced_in_lesson: 5
    examples: [perro]
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 7 — §6 (intentar + infinitive without 'a'; silent h)
  # ──────────────────────────────────────────────────────────────

  - id: intentar-plus-infinitive-no-a
    category: grammar
    description: "`intentar` (to try) takes an infinitive directly, with NO 'a'. It is not a verb of motion. Establishes the baseline: non-motion verbs do not take 'a' before a following infinitive."
    prerequisites: [modal-quiero-plus-infinitive]
    introduced_in_lesson: 7
    examples:
      - "Intento publicarlo"
      - "Intento continuarlo"
    exceptions: []

  - id: phonology-h-silent
    category: phonology
    description: "The letter `h` is completely silent in Spanish: horrible → 'orrible'."
    prerequisites: []
    introduced_in_lesson: 7
    examples: [horrible, hablar, hacer]
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 8 — §7 (voy, pasar — verbs of motion take 'a'; ver does not; los)
  # ──────────────────────────────────────────────────────────────

  - id: verb-motion-plus-a-before-infinitive
    category: grammar
    description: "Verbs of motion (ir, pasar, venir, salir) take `a` before a following infinitive — even when no literal motion is happening. Non-motion verbs (intentar, ver, querer) do not."
    prerequisites: [modal-quiero-plus-infinitive, intentar-plus-infinitive-no-a]
    introduced_in_lesson: 8
    examples:
      - "Voy a cancelarlo"
      - "Voy a pasar a visitarte"
      - "Voy a intentar verlos"
    exceptions: []

  - id: do-pronoun-plural-los-las
    category: grammar
    description: "Plural direct object pronouns: `los` (them, masc/mixed) and `las` (them, fem)."
    prerequisites: [do-pronoun-basic]
    introduced_in_lesson: 8
    examples:
      - "Quiero verlos"
      - "Voy a verlos"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 9 — §8 (quiere, venir, debo; articles GAP-fill)
  # ──────────────────────────────────────────────────────────────

  - id: verb-quiere-third-person-singular
    category: grammar
    description: "`quiere` covers he wants / she wants / it wants / you-formal wants. Same surface form for third-person singular and formal second-person."
    prerequisites: [modal-quiero-plus-infinitive]
    introduced_in_lesson: 9
    examples:
      - "Quiere visitarme"
      - "Por que no quiere visitarme"
    exceptions: []
    # At this lesson, `quiere` is a memorized chunk, like `quiero`. The regular
    # third-singular -ar rule is generalized at L12 and covers `quiere` retroactively.

  - id: modal-debo-plus-infinitive-no-que
    category: grammar
    description: "`debo` (I must / I owe) takes an infinitive directly. Unlike `tengo que`, `debo` does NOT take `que`."
    prerequisites: [modal-quiero-plus-infinitive]
    introduced_in_lesson: 9
    examples:
      - "Debo continuar"
      - "Debo identificarlo"
    exceptions: []
    # Forward-ref: contrasts with `tengo que` + infinitive (L15), which REQUIRES `que`.

  - id: preposition-a-motion-destination
    category: grammar
    description: "`a` before a noun expresses motion toward a destination: `a la casa` (to the house). Parallel to `a`+infinitive for motion verbs."
    prerequisites: [verb-motion-plus-a-before-infinitive]
    introduced_in_lesson: 9
    examples:
      - "Quiere venir a la casa"
      - "Voy a pasar a la casa"
    exceptions: []

  - id: article-el-la-basic
    category: grammar
    description: "Definite articles: `el` (masc sg), `la` (fem sg), `los` (masc/mixed pl), `las` (fem pl). Agree in gender and number with the noun."
    prerequisites: []
    introduced_in_lesson: 9
    examples:
      - "la casa"
      - "las casas"
    exceptions: []
    # GAP-FILL: teacher uses `la casa` from §8 without explaining articles.
    # Full -a feminine rule is introduced at §23 (batch 2). See batch-01-gaps.md.

  # ──────────────────────────────────────────────────────────────
  # Lesson 10 — §9 (saber as infinitive; si)
  # ──────────────────────────────────────────────────────────────

  - id: conjunction-si-yes-or-if
    category: grammar
    description: "`si` means both `yes` and `if`, distinguished by context."
    prerequisites: []
    introduced_in_lesson: 10
    examples:
      - "Quiero saber si quiere invitarme"
      - "Supongo que si"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 11 — §10 (infinitive -r; tener family; yo-go; accent; future-via-time)
  # ──────────────────────────────────────────────────────────────

  - id: verb-infinitive-ending-r
    category: grammar
    description: "All Spanish infinitives end in -r. Three groups: -ar, -er, -ir. This is the dictionary form."
    prerequisites: []
    introduced_in_lesson: 11
    examples: [hablar, comer, vivir, intentar, saber, salir]
    exceptions: []

  - id: verb-irregular-yo-go
    category: exception-cluster
    description: "A closed set of verbs whose first-person singular form ends in -go: tengo (tener), vengo (venir), pongo (poner), salgo (salir). Rest of conjugation follows normal patterns (or stem-change rules)."
    prerequisites: [verb-infinitive-ending-r]
    introduced_in_lesson: 11
    examples:
      - "tener → tengo"
      - "venir → vengo"
      - "poner → pongo"
      - "salir → salgo"
    exceptions: []
    vocab_refs: [tener, venir, poner, salir, obtener, contener, sostener, mantener, entretener]

  - id: phonology-stress-accent-default
    category: phonology
    description: "Default stress rule: words ending in a vowel, n, or s take stress on the second-to-last syllable; words ending in any other consonant (including -r, -l, -d) take stress on the last syllable. `intentar` stresses the final -ar; `intento` stresses the middle `ten`."
    prerequisites: []
    introduced_in_lesson: 11
    examples:
      - "intentar (stress: -TAR)"
      - "intento (stress: -TEN-)"
    exceptions: []

  - id: future-via-time-marker
    category: grammar
    description: "Spanish can express future using present tense + a time marker (mañana, mas tarde, esta noche, pronto). No auxiliary like English 'will' is needed. `Vengo mañana` = `I will come tomorrow`."
    prerequisites: []
    introduced_in_lesson: 11
    examples:
      - "Vengo mañana"
      - "Como con Pablo mañana"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 12 — §11 (regular conjugation skeleton; pronoun placement flexibility)
  # ──────────────────────────────────────────────────────────────

  - id: verb-present-yo-regular
    category: grammar
    description: "Regular first-person singular (yo) form for all three conjugations: drop the final -r from the infinitive and add -o. `hablar → hablo`, `comer → como`, `vivir → vivo`. Covers -ar, -er, -ir regulars."
    prerequisites: [verb-infinitive-ending-r]
    introduced_in_lesson: 12
    examples:
      - "tolerar → tolero"
      - "eliminar → elimino"
      - "durar → duro"
    exceptions: []

  - id: verb-present-third-singular-ar
    category: grammar
    description: "Regular third-person singular for -ar verbs: drop the -r. `eliminar → elimina`. Same form covers he / she / it / you-formal."
    prerequisites: [verb-infinitive-ending-r]
    introduced_in_lesson: 12
    examples:
      - "eliminar → elimina"
      - "durar → dura"
      - "masticar → mastica"
    exceptions: []

  - id: verb-present-third-plural-add-n
    category: grammar
    description: "Regular third-person plural: take the third-person singular form and add -n. `elimina → eliminan`, `colabora → colaboran`. Covers they (masc/fem/mixed) and you-guys (plural)."
    prerequisites: [verb-present-third-singular-ar]
    introduced_in_lesson: 12
    examples:
      - "elimina → eliminan"
      - "colabora → colaboran"
      - "habla → hablan"
    exceptions: []
    # Extends automatically to -er/-ir as their third-singular forms land at L13
    # (vende → venden, vive → viven).

  - id: pronoun-placement-flexible
    category: grammar
    description: "When a sentence has TWO verbs (conjugated verb + infinitive), a pronoun may go either BEFORE the conjugated verb or attach to the END of the infinitive — both are valid. When a sentence has only ONE conjugated verb, the pronoun MUST go before it."
    prerequisites: [do-pronoun-postverbal-infinitive]
    introduced_in_lesson: 12
    examples:
      - "Quiero verlo / Lo quiero ver"
      - "Debo invitarlo / Lo debo invitar"
      - "Lo vendo (one verb — pronoun must come before)"
    exceptions: []
    # Flexibility extends to compound pronouns at L13: `Me lo quiere vender` / `Quiere vendérmelo`.

  # ──────────────────────────────────────────────────────────────
  # Lesson 13 — §12 (vender, -ion feminine, me lo, nos; -ity → -idad transfer)
  # ──────────────────────────────────────────────────────────────

  - id: verb-present-third-singular-er
    category: grammar
    description: "Regular third-person singular for -er and -ir verbs: drop the -er / -ir ending, add -e. `vender → vende`, `comer → come`, `vivir → vive`. -er and -ir are identical in this form (they diverge only in the nosotros form at L20). Same form covers he / she / it / you-formal."
    prerequisites: [verb-infinitive-ending-r]
    introduced_in_lesson: 13
    examples:
      - "vender → vende"
      - "comer → come"
      - "vivir → vive"
    exceptions: []

  - id: noun-gender-ion-feminine
    category: grammar
    description: "Nouns ending in -ion are feminine: `la administracion`, `la celebracion`, `la situacion`. Takes `la`/`las` articles."
    prerequisites: [article-el-la-basic]
    introduced_in_lesson: 13
    examples:
      - "la administracion"
      - "la celebracion"
      - "la asociacion"
    exceptions: []

  - id: pronoun-nos-us
    category: grammar
    description: "`nos` = us. Works as both direct object and indirect object (and later, reflexive)."
    prerequisites: [do-pronoun-basic]
    introduced_in_lesson: 13
    examples:
      - "Nos venden algo"
      - "No nos lo venden"
    exceptions: []

  - id: pronoun-compound-indirect-before-direct
    category: grammar
    description: "When two object pronouns appear together, the indirect object comes first, followed by the direct object. At this level: `me`, `te`, `nos` function as indirect objects; `lo`, `la`, `los`, `las` as direct objects. `me lo venden` (they sell it to me), not `lo me venden`. Placement flexibility from L12 still applies in two-verb sentences."
    prerequisites: [do-pronoun-basic, pronoun-nos-us]
    introduced_in_lesson: 13
    examples:
      - "Me lo venden"
      - "No me lo venden"
      - "Por que no nos lo venden"
      - "Me lo quiere vender / Quiere vendérmelo"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 14 — §13 (hacer, que, puedo, llegar/salir/esperar; -ary → -ario transfer)
  # ──────────────────────────────────────────────────────────────

  - id: modal-puedo-plus-infinitive
    category: grammar
    description: "`puedo` (I can / I am able to) takes an infinitive directly. No 'a', no 'que'."
    prerequisites: [modal-quiero-plus-infinitive]
    introduced_in_lesson: 14
    examples:
      - "Puedo venir"
      - "Puedes venir"
      - "No puedo encontrarlo"
    exceptions: []
    # `puedo` will be retroactively explained by verb-stem-change-o-to-ue at L18.

  - id: verb-present-tu-informal
    category: grammar
    description: "Second-person informal (tú) present: take the third-person singular form and add -s. `puede → puedes`, `quiere → quieres`, `habla → hablas`."
    prerequisites: [verb-present-third-singular-ar, verb-present-third-singular-er]
    introduced_in_lesson: 14
    examples:
      - "puede → puedes"
      - "quiere → quieres"
      - "sabe → sabes"
    exceptions: []

  - id: interrogative-que-what
    category: grammar
    description: "`que` = `what` in questions. No subject-verb inversion required: `Que haces` = `What are you doing`."
    prerequisites: []
    introduced_in_lesson: 14
    examples:
      - "Que haces"
      - "Que quieres"
      - "Que piensas"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 15 — §14 first half (se, salgo, tengo que)
  # ──────────────────────────────────────────────────────────────

  - id: verb-irregular-saber-yo-se
    category: exception-cluster
    description: "`saber` has an irregular first-person singular: `sé` (written `se` without accents in the teacher's notes; formally `sé`). Rest of the conjugation is regular."
    prerequisites: [verb-present-yo-regular]
    introduced_in_lesson: 15
    examples:
      - "Lo se"
      - "No se que quiere"
    exceptions: []
    vocab_refs: [saber]

  - id: modal-tengo-que-plus-infinitive
    category: grammar
    description: "`tengo que` + infinitive = `I have to` + verb. The `que` is REQUIRED — without it, the phrase is ungrammatical. Contrast with `debo` (no `que`)."
    prerequisites: [verb-irregular-yo-go, verb-infinitive-ending-r]
    introduced_in_lesson: 15
    examples:
      - "Tengo que hacerlo"
      - "Lo tengo que hacer"
      - "Tengo que comer"
    exceptions: []

  # Modal patterns summary (as of L15):
  # - `quiero` / `debo` / `puedo` + infinitive                           (bare, no marker)
  # - `tengo que` + infinitive                                            (requires `que`)
  # - `ir` / `pasar` / `venir` / `salir` + `a` + infinitive               (motion verbs)
  # - `intentar` + infinitive                                             (bare, non-motion baseline at L7)

  # ──────────────────────────────────────────────────────────────
  # Lesson 16 — §14 tail (poner family + pose → poner transfer pattern)
  # Pure transfer-pattern lesson. No new grammar rules; reuses yo-go.
  # ──────────────────────────────────────────────────────────────
  # (No rules introduced here — see transfer-patterns.yaml: stem-pose-to-poner)

  # ──────────────────────────────────────────────────────────────
  # Lesson 17 — §15 (e → ie stem change; cuando)
  # ──────────────────────────────────────────────────────────────

  - id: verb-stem-change-e-to-ie
    category: grammar
    description: "A class of verbs undergoes `e → ie` stem change in forms where the stem is stressed (yo, tú, él/ella, ellos). The split adds stress. `pensar → pienso, piensa, piensan, piensas`. The we-form does NOT split (stress moves to the ending). Retroactively explains `quiero` (querer), `tiene` (tener), `viene` (venir)."
    prerequisites: [verb-present-yo-regular, verb-present-third-singular-ar, verb-present-third-singular-er]
    introduced_in_lesson: 17
    examples:
      - "pensar → pienso / piensa / piensan / piensas / pensamos"
      - "entender → entiendo / entiende / entienden"
      - "perder → pierdo / pierde / pierden"
      - "cerrar → cierro / cierra / cierran"
      - "empezar → empiezo / empieza / empiezan"
      - "preferir → prefiero / prefiere / prefieren"
    exceptions: []
    vocab_refs: [pensar, entender, perder, cerrar, empezar, preferir, querer, tener, venir]

  - id: interrogative-cuando-when
    category: grammar
    description: "`cuando` = `when`. Used for questions and for subordinate clauses."
    prerequisites: []
    introduced_in_lesson: 17
    examples:
      - "Cuando vienes"
      - "Cuando vienes a comer"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 18 — §16 (o → ue stem change; me duermo reflexive usage)
  # ──────────────────────────────────────────────────────────────

  - id: verb-stem-change-o-to-ue
    category: grammar
    description: "A class of verbs undergoes `o → ue` stem change in forms where the stem is stressed (yo, tú, él/ella, ellos). `poder → puedo, puede, pueden, puedes`. The we-form does NOT split. Retroactively explains `puedo`."
    prerequisites: [verb-present-yo-regular, verb-present-third-singular-ar, verb-stem-change-e-to-ie]
    introduced_in_lesson: 18
    examples:
      - "poder → puedo / puede / pueden / puedes / podemos"
      - "dormir → duermo / duerme / duermen / dormimos"
      - "encontrar → encuentro / encuentra / encuentran"
      - "mostrar → muestro / muestra / muestran"
      - "colgar → cuelgo / cuelga / cuelgan"
    exceptions: []
    vocab_refs: [poder, dormir, encontrar, mostrar, colgar, demostrar, tomar]
    # Note: `tomar` (take/drink) does NOT stem-change despite containing -o-. It is regular.
    # The split only occurs for specific verbs on a known list, not for every stem -o-.

  # ──────────────────────────────────────────────────────────────
  # Lesson 19 — §17 (nosotros -amos; stress rule prevents stem-split in we-form)
  # ──────────────────────────────────────────────────────────────

  - id: verb-present-nosotros-ar
    category: grammar
    description: "Regular nosotros (we) form for -ar verbs: drop -r, add -mos → -amos. `tomar → tomamos`, `hablar → hablamos`."
    prerequisites: [verb-present-yo-regular]
    introduced_in_lesson: 19
    examples:
      - "tomar → tomamos"
      - "hablar → hablamos"
      - "encontrar → encontramos"
      - "pensar → pensamos"
    exceptions: []

  - id: verb-stem-change-no-split-nosotros
    category: grammar
    description: "Stem-changing -ar verbs (both e→ie and o→ue) do NOT split in the nosotros form, because stress falls on the -amos ending rather than the stem. `pensar → pensamos` (not pienamos), `encontrar → encontramos` (not encuentramos). Extends to -er/-ir nosotros forms (-emos, -imos) at L20."
    prerequisites: [verb-stem-change-e-to-ie, verb-stem-change-o-to-ue, verb-present-nosotros-ar]
    introduced_in_lesson: 19
    examples:
      - "pensamos (not pienamos)"
      - "encontramos (not encuentramos)"
      - "mostramos (not muestramos)"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 20 — §18 (nosotros -emos / -imos; aqui/aca adverbs)
  # ──────────────────────────────────────────────────────────────

  - id: verb-present-nosotros-er
    category: grammar
    description: "Regular nosotros (we) form for -er verbs: drop -er, add -emos. `vender → vendemos`, `perder → perdemos`, `comer → comemos`."
    prerequisites: [verb-present-nosotros-ar]
    introduced_in_lesson: 20
    examples:
      - "vender → vendemos"
      - "perder → perdemos"
      - "comer → comemos"
    exceptions: []

  - id: verb-present-nosotros-ir
    category: grammar
    description: "Regular nosotros (we) form for -ir verbs: drop -ir, add -imos. `vivir → vivimos`, `venir → venimos`, `preferir → preferimos`. Note: -er and -ir diverge ONLY in the nosotros form."
    prerequisites: [verb-present-nosotros-er]
    introduced_in_lesson: 20
    examples:
      - "vivir → vivimos"
      - "venir → venimos"
      - "preferir → preferimos"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 21 — §19 (ir irregular; donde; esta noche; -e gender)
  # ──────────────────────────────────────────────────────────────

  - id: verb-irregular-ir
    category: exception-cluster
    description: "`ir` (to go) is fully irregular: voy (I go), va (he/she/it/you-formal), van (they), vas (you-informal), vamos (we). Verb of motion — takes `a` before infinitive."
    prerequisites: [verb-motion-plus-a-before-infinitive]
    introduced_in_lesson: 21
    examples:
      - "Voy a comer"
      - "Vamos a verla"
      - "A donde vas"
    exceptions: []
    vocab_refs: [ir]

  - id: interrogative-donde-where
    category: grammar
    description: "`donde` = `where`. Combines with `a` to form `a donde` (to where) for destinations."
    prerequisites: []
    introduced_in_lesson: 21
    examples:
      - "Donde estas"
      - "A donde vas"
      - "Donde viven"
    exceptions: []

  - id: noun-gender-e-context-dependent
    category: grammar
    description: "Nouns ending in -e do not have a predictable gender. Must be learned per word: `la noche` (fem), `la carne` (fem), `el coche` (masc)."
    prerequisites: [article-el-la-basic]
    introduced_in_lesson: 21
    examples:
      - "la noche"
      - "la carne"
      - "el coche"
    exceptions: []

  # ──────────────────────────────────────────────────────────────
  # Lesson 22 — §20 (ver conjugation; future via going-to; nos reflexive; next week)
  # ──────────────────────────────────────────────────────────────

  - id: verb-irregular-ver
    category: exception-cluster
    description: "`ver` (to see) is regular in all forms except yo: `veo` (not *vo). Rest follows regular -er pattern: ve / ven / ves / vemos."
    prerequisites: [verb-present-yo-regular, verb-present-third-singular-er, verb-present-nosotros-er]
    introduced_in_lesson: 22
    examples:
      - "veo / ve / ven / ves / vemos"
      - "La veo mas tarde"
      - "Nos vemos"
    exceptions: []
    vocab_refs: [ver]

  - id: future-via-going-to
    category: grammar
    description: "Future with `ir a` + infinitive, parallel to English `going to`: `vamos a verla` = `we are going to see her`. Uses ir conjugation + a + infinitive. Coexists with future-via-time-marker (L11): `Voy a comer mañana` and `Como mañana` both express future; `ir a` makes intention/plan more explicit."
    prerequisites: [verb-irregular-ir, verb-motion-plus-a-before-infinitive]
    introduced_in_lesson: 22
    examples:
      - "Vamos a verla"
      - "Vas a verlos"
      - "Voy a comer"
    exceptions: []

  - id: pronoun-nos-reflexive-reciprocal
    category: grammar
    description: "`nos` can mean `us`, `ourselves`, or `each other` depending on context. `Nos vemos` = `we see each other` (most commonly used as a farewell: `see you later`)."
    prerequisites: [pronoun-nos-us]
    introduced_in_lesson: 22
    examples:
      - "Nos vemos"
      - "Nos vemos la semana que viene"
    exceptions: []
