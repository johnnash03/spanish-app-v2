<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>léxico — Spanish learning app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="screens-1.jsx"></script>
  <script type="text/babel" src="screens-2.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SCREENS = [
      { id: 'home', label: 'Home' },
      { id: 'units', label: 'Unit list' },
      { id: 'unitDetail', label: 'Unit detail' },
      { id: 'practice', label: 'Practice' },
      { id: 'review', label: 'Review' },
      { id: 'deliberate', label: 'Deliberate practice' },
      { id: 'vocab', label: 'Vocab bank' },
      { id: 'wordDetail', label: 'Word detail' },
      { id: 'learn', label: 'Learn new words' },
      { id: 'flashcards', label: 'Flashcards' },
      { id: 'vocabSummary', label: 'Vocab summary' },
    ];

    function App() {
      const [screen, setScreen] = useState(() => {
        const h = window.location.hash.replace('#', '');
        return SCREENS.find(s => s.id === h) ? h : 'home';
      });
      const [navOpen, setNavOpen] = useState(false);

      const go = (s) => {
        setScreen(s);
        window.location.hash = s;
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      useEffect(() => {
        const onHash = () => {
          const h = window.location.hash.replace('#', '');
          if (SCREENS.find(s => s.id === h)) setScreen(h);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      let Comp = null;
      switch (screen) {
        case 'home': Comp = HomeScreen; break;
        case 'units': Comp = UnitListScreen; break;
        case 'unitDetail': Comp = UnitDetailScreen; break;
        case 'practice': Comp = PracticeScreen; break;
        case 'review': Comp = ReviewScreen; break;
        case 'deliberate': Comp = DeliberateScreen; break;
        case 'vocab': Comp = VocabBankScreen; break;
        case 'wordDetail': Comp = WordDetailScreen; break;
        case 'learn': Comp = LearnScreen; break;
        case 'flashcards': Comp = FlashcardScreen; break;
        case 'vocabSummary': Comp = VocabSummaryScreen; break;
        default: Comp = HomeScreen;
      }

      return (
        <div data-screen-label={SCREENS.find(s => s.id === screen)?.label || screen}>
          <Comp go={go} />

          {/* Floating screen jumper */}
          <div style={{
            position: 'fixed', bottom: 16, left: 16, zIndex: 100,
            fontFamily: 'var(--sans)',
          }}>
            <button
              onClick={() => setNavOpen(o => !o)}
              style={{
                display: 'inline-flex', alignItems: 'center', gap: 8,
                padding: '8px 12px',
                background: 'var(--ink)', color: 'var(--paper)',
                borderRadius: 999, border: 'none',
                fontSize: 12, letterSpacing: '-0.005em',
                boxShadow: '0 4px 16px rgba(42,38,34,0.18)',
              }}
            >
              <span style={{ width: 6, height: 6, borderRadius: 999, background: 'var(--accent)' }} />
              {SCREENS.find(s => s.id === screen)?.label}
              <span style={{ opacity: 0.5, marginLeft: 4 }}>{navOpen ? '▾' : '▴'}</span>
            </button>

            {navOpen && (
              <div style={{
                position: 'absolute', bottom: 'calc(100% + 8px)', left: 0,
                background: 'var(--ink)', color: 'var(--paper)',
                borderRadius: 8,
                padding: 6, minWidth: 200,
                boxShadow: '0 8px 24px rgba(42,38,34,0.22)',
              }}>
                <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.08em', opacity: 0.5, padding: '8px 10px 4px' }}>
                  Jump to screen
                </div>
                {SCREENS.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => { go(s.id); setNavOpen(false); }}
                    style={{
                      width: '100%', textAlign: 'left',
                      padding: '7px 10px', borderRadius: 5,
                      background: screen === s.id ? 'rgba(255,255,255,0.08)' : 'transparent',
                      color: screen === s.id ? 'var(--paper)' : 'rgba(247,244,237,0.7)',
                      fontSize: 12,
                    }}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
